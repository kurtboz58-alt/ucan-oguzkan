<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uçan Oğuzkaan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            border-radius: 15px;
            cursor: pointer;
            display: block;
        }
        /* Oyun İçi Üst Butonlar */
        .menu-btn {
            position: absolute;
            top: 15px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            z-index: 5;
        }
        #pauseBtn { right: 80px; }
        #exitBtn { right: 15px; }

        /* Başlangıç ve Menü Ekranları */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 400px;
            height: 600px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            color: white;
            text-align: center;
            z-index: 10;
        }
        .screen h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #FFD700;
        }
        .screen p {
            font-size: 18px;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .btn-main {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px #388E3C;
        }
        .btn-main:active {
            transform: translateY(2px);
            box-shadow: 0 2px #388E3C;
        }
        #pauseScreen {
            display: none;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Sağ Üst Kontrol Butonları -->
        <button id="pauseBtn" class="menu-btn" onclick="oyunuDurdurDevamEt()" style="display:none;">Durdur</button>
        <button id="exitBtn" class="menu-btn" onclick="cikisYap()" style="display:none;">Çık</button>

        <!-- Başlangıç Ekranı -->
        <div id="startScreen" class="screen">
            <h1>Uçan Oğuzkaan</h1>
            <p>Kaydedilen Puan: <span id="kayitliPuan">10</span></p>
            <button class="btn-main" onclick="oyunuBaslat()">Oyunu Başlat</button>
        </div>

        <!-- Durdurma Ekranı -->
        <div id="pauseScreen" class="screen">
            <h1>Oyun Durduruldu</h1>
            <p>Dinlenme vakti!</p>
            <button class="btn-main" onclick="oyunuDurdurDevamEt()">Devam Et</button>
            <button class="btn-main" style="background:#f44336; box-shadow: 0 4px #d32f2f;" onclick="puaniKaydetVeCik()">Kaydet & Çık</button>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <audio id="oguzkanSes" src="oguzkan.mp3"></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const ses = document.getElementById("oguzkanSes");
        const startScreen = document.getElementById("startScreen");
        const pauseScreen = document.getElementById("pauseScreen");
        const pauseBtn = document.getElementById("pauseBtn");
        const exitBtn = document.getElementById("exitBtn");
        const kayitliPuanText = document.getElementById("kayitliPuan");

        let oyunBasladi = false;
        let oyunDurduruldu = false;

        let skor = localStorage.getItem("oguzkanPuan") ? parseInt(localStorage.getItem("oguzkanPuan")) : 10;
        kayitliPuanText.innerText = skor;

        const oguzkanImg = new Image();
        oguzkanImg.src = "oguzkan.png";
        let imageLoaded = false;
        oguzkanImg.onload = function() {
            imageLoaded = true;
        };

        let oguzkan = {
            x: 80,
            y: 250,
            width: 65,
            height: 65,
            gravity: 0.35,
            lift: -7.5,
            velocity: 0
        };

        let nesneler = []; 
        let kopekler = []; 

        function oyunuBaslat() {
            oyunBasladi = true;
            oyunDurduruldu = false;
            startScreen.style.display = "none";
            pauseScreen.style.display = "none";
            pauseBtn.style.display = "block";
            exitBtn.style.display = "block";
            
            ses.play().then(() => {
                ses.pause();
                ses.currentTime = 0;
            }).catch(e => console.log("Ses tetikleme hatası:", e));
            
            // Döngüyü doğrudan başlatıyoruz
            gameLoop();
        }

        function oyunuDurdurDevamEt() {
            if (!oyunBasladi) return;
            oyunDurduruldu = !oyunDurduruldu;

            if (oyunDurduruldu) {
                pauseScreen.style.display = "flex";
                pauseBtn.innerText = "Devam";
            } else {
                pauseScreen.style.display = "none";
                pauseBtn.innerText = "Durdur";
                gameLoop();
            }
        }

        function puaniKaydetVeCik() {
            localStorage.setItem("oguzkanPuan", skor);
            cikisYap();
        }

        function cikisYap() {
            oyunBasladi = false;
            oyunDurduruldu = false;
            pauseScreen.style.display = "none";
            pauseBtn.style.display = "none";
            exitBtn.style.display = "none";
            
            kayitliPuanText.innerText = skor;
            startScreen.style.display = "flex";
            
            oguzkan.y = 250;
            oguzkan.velocity = 0;
            nesneler = [];
            kopekler = [];
        }

        function zipla() {
            if (!oyunBasladi || oyunDurduruldu) return;

            oguzkan.velocity = oguzkan.lift;

            ses.pause();
            ses.currentTime = 0;
            ses.play().catch(e => console.log("Ses çalma hatası:", e));
        }

        window.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                zipla();
            }
        });

        canvas.addEventListener("click", zipla);
        canvas.addEventListener("touchstart", function(e) {
            e.preventDefault();
            zipla();
        });

        function nesneUret() {
            nesneler.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - 200) + 40,
                radius: 15,
                speed: 2
            });
        }

        function kopekUret() {
            kopekler.push({
                x: canvas.width,
                y: canvas.height - 55,
                width: 40,
                height: 30,
                speed: 2.5
            });
        }

        let frameCount = 0;
        function update() {
            if (oyunDurduruldu || !oyunBasladi) return;

            oguzkan.velocity += oguzkan.gravity;
            oguzkan.y += oguzkan.velocity;

            if (oguzkan.y + oguzkan.height >= canvas.height - 30) {
                oguzkan.y = canvas.height - 30 - oguzkan.height;
                oguzkan.velocity = -5;
            }
            if (oguzkan.y <= 0) {
                oguzkan.y = 0;
                oguzkan.velocity = 0;
            }

            if (frameCount % 90 === 0) {
                nesneUret();
            }
            if (frameCount % 140 === 0) {
                kopekUret();
            }

            for (let i = nesneler.length - 1; i >= 0; i--) {
                nesneler[i].x -= nesneler[i].speed;

                let dx = oguzkan.x + oguzkan.width/2 - nesneler[i].x;
                let dy = oguzkan.y + oguzkan.height/2 - nesneler[i].y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < oguzkan.width/2 + nesneler[i].radius) {
                    skor += 5; 
                    localStorage.setItem("oguzkanPuan", skor);
                    nesneler.splice(i, 1);
                } else if (nesneler[i].x < -20) {
                    nesneler.splice(i, 1);
                }
            }

            for (let j = kopekler.length - 1; j >= 0; j--) {
                kopekler[j].x -= kopekler[j].speed;

                if (
                    oguzkan.x < kopekler[j].x + kopekler[j].width &&
                    oguzkan.x + oguzkan.width > kopekler[j].x &&
                    oguzkan.y + oguzkan.height > kopekler[j].y
                ) {
                    skor = Math.max(0, skor - 2); 
                    localStorage.setItem("oguzkanPuan", skor);
                    kopekler.splice(j, 1);        
                } else if (kopekler[j] && kopekler[j].x < -50) {
                    kopekler.splice(j, 1);
                }
            }

            frameCount++;
        }

        function draw() {
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            for (let i = 0; i < nesneler.length; i++) {
                ctx.fillStyle = "#000000"; 
                ctx.beginPath();
                ctx.arc(nesneler[i].x, nesneler[i].y, nesneler[i].radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }

            for (let j = 0; j < kopekler.length; j++) {
                ctx.fillStyle = "#8B4513"; 
                ctx.fillRect(kopekler[j].x, kopekler[j].y + 10, kopekler[j].width, kopekler[j].height - 10);
                ctx.fillRect(kopekler[j].x + 25, kopekler[j].y, 15, 15);
            }

            if (imageLoaded) {
                ctx.drawImage(oguzkanImg, oguzkan.x, oguzkan.y, oguzkan.width, oguzkan.height);
            } else {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(oguzkan.x, oguzkan.y, oguzkan.width, oguzkan.height);
            }

            ctx.fillStyle = "#D2143A";
            ctx.font = "bold 26px Arial";
            ctx.fillText("Puan: " + skor, 20, 40);
        }

        function gameLoop() {
            if (!oyunBasladi || oyunDurduruldu) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
